<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ロビー画面</title>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: radial-gradient(circle, #1a1a5e 0%, #000000 100%);
            --accent-red: #e63946;
            --sidebar-purple: #c678dd;
            --panel-gray: #7a7a7a;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            background: var(--bg-gradient);
            font-family: 'Zen Old Mincho', serif;
            color: #fff;
            overflow: hidden;
        }

        /* サイドバー */
        .sidebar {
            width: 250px;
            background-color: rgba(198, 120, 221, 0.2);
            backdrop-filter: blur(10px);
            border-right: 3px solid #000;
            display: flex;
            flex-direction: column;
            padding: 40px 20px;
            box-sizing: border-box;
        }

        .user-info {
            background-color: var(--panel-gray);
            border: 3px solid #000;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 40px;
            box-shadow: 5px 5px 0px #000;
        }

        .user-info h2 {
            margin: 0 0 10px 0;
            font-size: 24px;
            border-bottom: 2px solid #000;
        }

        .balance {
            font-size: 28px;
            color: #ffd700;
            text-align: right;
        }

        /* メインコンテンツ */
        .main-content {
            flex-grow: 1;
            padding: 30px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 20px;
            justify-items: center;
            align-items: center;
        }

        /* タイル設定：白背景・黒枠に統一 */
        .menu-tile {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 280px;
            max-height: 280px;
            background-color: #ffffff;
            border: 5px solid #000000;
            border-radius: 40px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 55px; 
            box-sizing: border-box;
            cursor: pointer;
            box-shadow: 15px 15px 30px rgba(0, 0, 0, 0.6);
            transition: all 0.3s;
            overflow: hidden;
            text-decoration: none;
            color: #000;
        }

        .menu-tile:hover {
            transform: scale(1.05) translateY(-10px);
            background-color: #f0f0f0;
        }

        .menu-tile::after {
            content: "CLICK TO OPEN";
            position: absolute;
            bottom: 15px;
            font-size: 14px;
            opacity: 0.5;
            z-index: 3;
        }

        .tile-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 85px); 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .tile-img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            z-index: 1;
        }

        .tile-label {
            font-size: 32px;
            font-weight: bold;
            z-index: 2;
            position: relative;
            line-height: 0.8;
            margin-bottom: 5px;
        }

        .logout-btn {
            margin-top: auto;
            background-color: var(--accent-red);
            border: 3px solid #000;
            padding: 10px;
            border-radius: 10px;
            color: #fff;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="user-info">
            <h2 id="display-name">Loading...</h2>
            <div id="display-id" style="font-size: 14px; opacity: 0.8;">ID: ---</div>
            <div class="balance"><span id="display-balance">0</span> Ft</div>
        </div>
        
        <div style="font-size: 20px; line-height: 2;">
            <div>▶ お知らせ</div>
            <div>▶ フレンド</div>
            <div>▶ 設定</div>
        </div>

        <a href="javascript:void(0)" class="logout-btn" onclick="logout()">ログアウト</a>
    </div>

    <div class="main-content">
        <div class="menu-tile">
            <div class="tile-content"><img src="交換.png" class="tile-img"></div>
            <div class="tile-label">交換</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="インゴット.png" class="tile-img"></div>
            <div class="tile-label">金属ガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="オイル.png" class="tile-img"></div>
            <div class="tile-label">燃料ガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="コメ.png" class="tile-img"></div>
            <div class="tile-label">食料ガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="石鹸.png" class="tile-img"></div>
            <div class="tile-label">民需ガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="銃.png" class="tile-img"></div>
            <div class="tile-label">軍需ガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="金.png" class="tile-img"></div>
            <div class="tile-label">コインガチャ</div>
        </div>

        <div class="menu-tile">
            <div class="tile-content"><img src="トランプ.png" class="tile-img"></div>
            <div class="tile-label">ギャンブル</div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const data = JSON.parse(sessionStorage.getItem('userData'));
            if (data) {
                document.getElementById('display-name').innerText = data.name;
                document.getElementById('display-id').innerText = "ID: " + data.id;
                document.getElementById('display-balance').innerText = data.balance || 0;
            }
        };

        // ログアウト処理を関数として独立させ、確実に遷移するようにしました
        function logout() {
            sessionStorage.clear();
            // ログイン画面のファイル名が異なる場合は、ここを修正してください
            window.location.replace('login.html');
        }
    </script>
</body>
</html>
